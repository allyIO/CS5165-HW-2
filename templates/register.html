<html>
	<form method="POST" action="/register" enctype="multipart/form-data">
    		Username: <input type="text" name="username"><br>
   		Password: <input type="password" name="password"><br>
    		First Name: <input type="firstname" name="firstname"><br>
    		Last Name: <input type="lastname" name="lastname"><br>
    		Email: <input type="text" name="email"><br>
    		Address: <input type="address" name="address"><br>
		Limerick: <input type="file" id="file" name="file"><br>
    		<input type="submit" value="Register">
	</form>
	<a href="./log-in" class="button-style">Log in</a>
</html>
